<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prelim Exam - In Progress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="exam-header">
        <div class="student-info">
            <strong id="studentFullName">Student</strong> · 
            <span id="studentSection">Section</span>
        </div>
        <div class="timer" id="timerDisplay">60:00</div>
    </div>

    <div class="exam-container">
        <!-- Loading overlay -->
        <div id="loadingOverlay" style="display:flex; justify-content:center; align-items:center; height:300px; color:#94a3b8; font-size:1.2rem; flex-direction:column; gap:1rem;">
            <div style="border:4px solid #1e293b; border-top:4px solid #3b82f6; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
            <span>Loading exam questions...</span>
        </div>

        <div class="question-container" id="questionContainer" style="display:none;">
            <div class="question-number" id="questionNumber">Question 1 of 100</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:0%"></div>
        </div>

        <div class="exam-nav">
            <span class="progress" id="progressText">0 / 100 answered</span>
            <button class="btn btn-secondary" id="submitBtn">⚠️ Submit Exam</button>
        </div>
    </div>

    <!-- Load data.js for results storage -->
    <script src="data.js"></script>

    <script>
        // ============================================================
        // 1. SESSION VALIDATION (same as before)
        // ============================================================
        const email = sessionStorage.getItem('studentEmail');
        const firstName = sessionStorage.getItem('studentFirstName') || '';
        const lastName = sessionStorage.getItem('studentLastName') || '';
        const studentId = sessionStorage.getItem('studentId');
        const section = sessionStorage.getItem('studentSection');
        const startTime = parseInt(sessionStorage.getItem('examStartTime'));

        if (!email || !studentId || !section || !startTime) {
            alert('Invalid session. Please login again.');
            window.location.href = 'index.html';
        }

        // Check if student already submitted
        if (typeof getStudentResult === 'function' && getStudentResult(email)) {
            alert('You have already completed this exam.');
            window.location.href = 'result.html';
        }

        // Display student info
        document.getElementById('studentFullName').textContent = firstName + ' ' + lastName;
        document.getElementById('studentSection').textContent = section;

        // ============================================================
        // 2. FETCH QUESTIONS FROM THE SERVER
        // ============================================================
        let QUESTION_BANK = [];
        let loadingComplete = false;

        async function fetchQuestions() {
            try {
                const response = await fetch('/api/questions', {
                    credentials: 'same-origin' // sends session cookie
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        alert('Session expired. Please login again.');
                        window.location.href = 'index.html';
                        return;
                    }
                    throw new Error(`Server responded with ${response.status}`);
                }

                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('No questions received from server.');
                }

                QUESTION_BANK = data;
                loadingComplete = true;

                // Hide loading overlay and show questions
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('questionContainer').style.display = 'block';

                // Start the exam
                loadQuestions();
            } catch (error) {
                console.error('Failed to load questions:', error);
                alert('Failed to load exam questions. Please contact the instructor.');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        // 3. EXAM LOGIC (timer, rendering, submission)
        // ============================================================
        const EXAM_DURATION = 60 * 60; // 60 minutes in seconds
        let timeLeft = EXAM_DURATION;
        let timerInterval;

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timeLeft = EXAM_DURATION - elapsed;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').textContent = '00:00';
                document.getElementById('timerDisplay').classList.add('danger');
                submitExam();
                return;
            }
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timerDisplay').textContent =
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft < 300) document.getElementById('timerDisplay').classList.add('danger');
            else if (timeLeft < 600) document.getElementById('timerDisplay').classList.add('warning');
        }

        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let totalQuestions = 0;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadQuestions() {
            if (!loadingComplete) return;
            const all = [...QUESTION_BANK];
            const shuffled = shuffleArray(all);
            questions = shuffled.slice(0, 100);
            totalQuestions = questions.length;
            currentIndex = 0;
            answers = {};
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= totalQuestions) {
                submitExam();
                return;
            }
            const q = questions[currentIndex];
            document.getElementById('questionNumber').textContent =
                `Question ${currentIndex + 1} of ${totalQuestions}`;
            document.getElementById('questionText').textContent = q.question;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'question';
                radio.value = idx;
                radio.id = `opt${idx}`;
                if (answers[currentIndex] !== undefined) {
                    radio.checked = (answers[currentIndex] === idx);
                    radio.disabled = true;
                }
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        answers[currentIndex] = idx;
                        updateProgress();
                        setTimeout(() => {
                            if (currentIndex < totalQuestions - 1) {
                                currentIndex++;
                                renderQuestion();
                            }
                        }, 300);
                    }
                });
                const span = document.createElement('span');
                span.textContent = `${letters[idx]}. ${opt}`;
                label.appendChild(radio);
                label.appendChild(span);
                container.appendChild(label);
            });
            updateProgress();
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            document.getElementById('progressText').textContent =
                `${answered} / ${totalQuestions} answered`;
            document.getElementById('progressFill').style.width = `${(answered / totalQuestions) * 100}%`;
        }

        // Anti-cheat measures
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());

        window.addEventListener('beforeunload', function(e) {
            const answered = Object.keys(answers).length;
            if (answered < totalQuestions) {
                e.preventDefault();
                e.returnValue = 'You have not completed the exam. Are you sure you want to leave?';
                return e.returnValue;
            }
        });

        document.getElementById('submitBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to submit? Unanswered questions will be marked wrong.')) {
                submitExam();
            }
        });

        function submitExam() {
            clearInterval(timerInterval);
            let score = 0;
            const answeredMap = {};
            const details = [];
            questions.forEach((q, idx) => {
                const selected = answers[idx];
                const isCorrect = selected === q.correct;
                if (isCorrect) score++;
                answeredMap[q.id] = selected;
                details.push({
                    question: q.question,
                    selected: selected !== undefined ? q.options[selected] : 'Not answered',
                    correct: q.options[q.correct],
                    isCorrect: isCorrect
                });
            });

            // Save to client-side storage (data.js)
            if (typeof saveResult === 'function') {
                saveResult(email, studentId, section, score, totalQuestions, answeredMap, questions);
            } else {
                console.warn('saveResult function not found – results not stored.');
            }

            sessionStorage.setItem('examScore', score);
            sessionStorage.setItem('examTotal', totalQuestions);
            sessionStorage.setItem('examDetails', JSON.stringify(details));
            sessionStorage.removeItem('examStartTime');

            window.location.href = 'result.html';
        }

        // Keyboard shortcut: Alt+S to submit
        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key === 's') {
                e.preventDefault();
                document.getElementById('submitBtn').click();
            }
        });

        // ============================================================
        // 4. START FETCHING QUESTIONS
        // ============================================================
        fetchQuestions();

        // Add spinning animation
        const style = document.createElement('style');
        style.textContent = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
