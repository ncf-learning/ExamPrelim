<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – NCF Exam System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📋 NCF EXAM SYSTEM</h1>
            <div class="subtitle">Social and Professional Issues</div>
            <span class="badge">Weeks 1–3 • 60 Minutes</span>
        </div>

        <div class="domain-info">
            <span class="icon">🔒</span>
            <span class="text">Restricted to <strong>@ncf.edu.ph</strong> and <strong>@gbox.ncf.edu.ph</strong></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@ncf.edu.ph" required autofocus />
                <span class="hint">Use your official NCF email address</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
                <span class="hint">Enter your account password</span>
            </div>

            <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>

        <div id="message" class="message" style="display:none;"></div>

        <div style="text-align:center; margin-top:1rem;">
            Don't have an account? <a href="register.html" style="color:#3b82f6;">Register here</a>
        </div>

        <div class="footer">
            National College of Forestry &bull; Academic Year 2025-2026
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <script type="module">
        import { supabase, getCurrentProfile, checkSessionAndRedirect } from './supabase.js';

        // ---------- DOM Elements ----------
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageDiv = document.getElementById('message');

        const ALLOWED_DOMAINS = ['@ncf.edu.ph', '@gbox.ncf.edu.ph'];

        function showMessage(text, isError = true) {
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            messageDiv.style.color = isError ? '#ef4444' : '#22c55e';
            messageDiv.style.background = isError ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)';
            messageDiv.style.padding = '0.75rem';
            messageDiv.style.borderRadius = '0.5rem';
            messageDiv.style.marginTop = '1rem';
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
        }

        // -------- Check if already logged in --------
        checkSessionAndRedirect();

        // -------- Login --------
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Validate email domain
            const domain = email.substring(email.lastIndexOf('@'));
            if (!ALLOWED_DOMAINS.includes(domain.toLowerCase())) {
                showMessage('Invalid email domain. Use @ncf.edu.ph or @gbox.ncf.edu.ph');
                emailInput.focus();
                return;
            }

            if (!password || password.length < 6) {
                showMessage('Please enter a valid password (min 6 characters).');
                passwordInput.focus();
                return;
            }

            try {
                // 1. Sign in with Supabase Auth
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password,
                });

                if (error) throw error;

                if (!data.user) {
                    throw new Error('Login failed. Please try again.');
                }

                // 2. Fetch user profile
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (profileError) throw profileError;

                // 3. Store session data (client-side)
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userId', data.user.id);
                sessionStorage.setItem('userRole', profile.role);
                sessionStorage.setItem('userName', profile.first_name + ' ' + profile.last_name);

                // 4. Redirect based on role
                if (profile.role === 'pending') {
                    showMessage('⏳ Your account is pending instructor approval. Please wait.', false);
                    // Sign out – they can't proceed yet
                    await supabase.auth.signOut();
                    sessionStorage.clear();
                    return;
                }

                if (profile.role === 'student') {
                    // Store student-specific data
                    sessionStorage.setItem('studentEmail', email);
                    sessionStorage.setItem('studentFirstName', profile.first_name);
                    sessionStorage.setItem('studentLastName', profile.last_name);
                    sessionStorage.setItem('studentId', profile.student_id);
                    sessionStorage.setItem('studentSection', profile.section);
                    window.location.href = 'dashboard.html';
                    return;
                }

                if (profile.role === 'instructor') {
                    window.location.href = 'instructor.html';
                    return;
                }

                showMessage('Unknown role. Please contact support.');

            } catch (error) {
                console.error('Login error:', error);
                let msg = error.message || 'Login failed. Please try again.';
                if (msg.includes('Invalid login credentials')) {
                    msg = 'Invalid email or password. Please try again.';
                }
                showMessage('❌ ' + msg);
            }
        });

        console.log('✅ Login page loaded.');
    </script>
</body>
</html>
