<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – NCF Learning System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📚 NCF LEARNING TRACKING SYSTEM</h1>
            <div class="subtitle">Naga College Foundation</div>
            <span class="badge">Student Portal</span>
        </div>

        <div class="domain-info">
            <span class="icon">🔒</span>
            <span class="text">Restricted to <strong>@ncf.edu.ph</strong> and <strong>@gbox.ncf.edu.ph</strong></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@ncf.edu.ph" required autofocus />
                <span class="hint">Use your official NCF email address</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
                <span class="hint">Enter your account password</span>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="message" style="margin-top:1rem; text-align:center; display:none; padding:0.75rem; border-radius:0.5rem;"></div>

        <div style="text-align:center; margin-top:1rem;">
            Don't have an account? <a href="register.html" style="color:#3b82f6;">Register here</a>
        </div>

        <div class="footer">
            Naga College Foundation &bull; Academic Year 2025-2026
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        // Supabase config
        const supabaseUrl = 'https://ynpednaybirzfcenmwhd.supabase.co';
        const supabaseAnonKey = 'sb_publishable_hDkrKWcFuZim7MypNeK0VQ_L_FciXAs';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        function showMessage(text, isError = true) {
            message.textContent = text;
            message.style.display = 'block';
            message.style.background = isError ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)';
            message.style.color = isError ? '#ef4444' : '#22c55e';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showMessage('Please enter email and password.');
                return;
            }

            try {
                // 1. Sign in
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // 2. Get profile (using maybeSingle – this is the key fix)
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                // 3. Redirect based on role
                if (profile?.role === 'instructor') {
                    window.location.href = 'instructor.html';
                } else if (profile?.role === 'student') {
                    window.location.href = 'dashboard.html';
                } else {
                    showMessage('⏳ Account pending approval.', false);
                    await supabase.auth.signOut();
                }

            } catch (error) {
                showMessage(error.message || 'Login failed. Please try again.');
            }
        });
    </script>
</body>
</html>
