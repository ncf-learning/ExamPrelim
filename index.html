<!-- Inside the login script, replace the validation part -->
<script src="data.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const studentId = document.getElementById('studentId').value.trim();
        const section = document.getElementById('section').value;
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // 1. Domain check
        const allowedDomains = ['@ncf.edu.ph', '@gbox.ncf.edu.ph'];
        const isValidDomain = allowedDomains.some(domain => email.toLowerCase().endsWith(domain));

        if (!isValidDomain) {
            errorText.textContent = 'Invalid email domain. Please use @ncf.edu.ph or @gbox.ncf.edu.ph';
            errorDiv.classList.add('show');
            return;
        }

        // 2. Official list check (if list is not empty)
        if (!isEmailOfficial(email)) {
            errorText.textContent = 'This email is not on the official list of allowed students. Please contact your instructor.';
            errorDiv.classList.add('show');
            return;
        }

        if (!studentId || studentId.length < 5) {
            errorText.textContent = 'Please enter a valid Student ID.';
            errorDiv.classList.add('show');
            return;
        }

        if (!section) {
            errorText.textContent = 'Please select your section.';
            errorDiv.classList.add('show');
            return;
        }

        // 3. Check if already took exam
        const existing = getStudentResult(email);
        if (existing) {
            if (confirm('You have already completed this exam. View your results?')) {
                sessionStorage.setItem('viewingEmail', email);
                window.location.href = 'result.html';
            }
            return;
        }

        sessionStorage.setItem('studentEmail', email);
        sessionStorage.setItem('studentId', studentId);
        sessionStorage.setItem('studentSection', section);
        sessionStorage.setItem('examStartTime', Date.now());

        window.location.href = 'exam.html';
    });

    // Clear error on input
    document.getElementById('email').addEventListener('input', function() {
        document.getElementById('errorMessage').classList.remove('show');
    });
    document.getElementById('studentId').addEventListener('input', function() {
        document.getElementById('errorMessage').classList.remove('show');
    });
    document.getElementById('section').addEventListener('change', function() {
        document.getElementById('errorMessage').classList.remove('show');
    });
</script>
