<script src="data.js"></script>
<script>
    (function() {
        'use strict';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const studentIdInput = document.getElementById('studentId');
        const sectionSelect = document.getElementById('section');
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        const ALLOWED_DOMAINS = ['@ncf.edu.ph', '@gbox.ncf.edu.ph'];

        function showError(msg) {
            errorText.textContent = msg;
            errorDiv.classList.add('show');
        }
        function hideError() {
            errorDiv.classList.remove('show');
        }

        emailInput.addEventListener('input', hideError);
        firstNameInput.addEventListener('input', hideError);
        lastNameInput.addEventListener('input', hideError);
        studentIdInput.addEventListener('input', hideError);
        sectionSelect.addEventListener('change', hideError);

        // --- Check if exam is active (client-side schedule) ---
        function isExamActive(section) {
            const scheduleStr = localStorage.getItem('exam_schedule');
            if (!scheduleStr) return false;
            try {
                const schedule = JSON.parse(scheduleStr);
                const now = Date.now();
                const entry = schedule[section];
                if (!entry) return false;
                const start = new Date(entry.start).getTime();
                const end = new Date(entry.end).getTime();
                return now >= start && now <= end;
            } catch (e) {
                return false;
            }
        }

        // --- Login: send to server ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const studentId = studentIdInput.value.trim();
            const section = sectionSelect.value;

            // Validate email domain
            const isValidDomain = ALLOWED_DOMAINS.some(function(domain) {
                return email.toLowerCase().endsWith(domain);
            });
            if (!isValidDomain) {
                showError('Invalid email domain. Please use @ncf.edu.ph or @gbox.ncf.edu.ph');
                emailInput.focus();
                return;
            }

            if (!firstName || firstName.length < 1) {
                showError('Please enter your first name.');
                firstNameInput.focus();
                return;
            }
            if (!lastName || lastName.length < 1) {
                showError('Please enter your last name.');
                lastNameInput.focus();
                return;
            }
            if (!studentId || studentId.length < 5) {
                showError('Please enter a valid Student ID (at least 5 characters).');
                studentIdInput.focus();
                return;
            }
            if (!section) {
                showError('Please select your section.');
                sectionSelect.focus();
                return;
            }

            if (!isExamActive(section)) {
                showError('The exam is not currently active for your section. Please check with your instructor.');
                sectionSelect.focus();
                return;
            }

            // Check if already took exam (client-side)
            try {
                const existing = getStudentResult(email);
                if (existing) {
                    if (confirm('You have already completed this exam. View your results?')) {
                        sessionStorage.setItem('viewingEmail', email);
                        window.location.href = 'result.html';
                    }
                    return;
                }
            } catch (err) {}

            // Send login request to server
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, firstName, lastName, studentId, section })
                });

                const data = await response.json();

                if (data.success) {
                    // Store client-side session data
                    sessionStorage.setItem('studentEmail', email);
                    sessionStorage.setItem('studentFirstName', firstName);
                    sessionStorage.setItem('studentLastName', lastName);
                    sessionStorage.setItem('studentId', studentId);
                    sessionStorage.setItem('studentSection', section);
                    sessionStorage.setItem('examStartTime', String(Date.now()));

                    window.location.href = 'exam.html';
                } else {
                    showError(data.error || 'Login failed. Please try again.');
                }
            } catch (err) {
                showError('Server error. Please try again later.');
                console.error(err);
            }
        });

        // --- Anti-inspection (unchanged) ---
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

        document.addEventListener('keydown', function(e) {
            const isDev = e.key === 'F12' ||
                          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                          (e.ctrlKey && e.key === 'U');
            if (isDev) {
                e.preventDefault();
                alert('Developer tools are disabled during the exam.');
                return false;
            }
        });

        document.querySelectorAll('#loginForm input, #loginForm select').forEach(function(el) {
            el.addEventListener('copy', function(e) { e.preventDefault(); });
            el.addEventListener('paste', function(e) { e.preventDefault(); });
            el.addEventListener('cut', function(e) { e.preventDefault(); });
        });

        function detectDevTools() {
            const start = performance.now();
            debugger;
            const end = performance.now();
            if (end - start > 100) {
                alert('Developer tools detected. Please close them to continue.');
                window.location.href = 'about:blank';
            }
        }
        setInterval(detectDevTools, 3000);

        console.log('✅ Secure login page loaded (server-side).');
    })();
</script>
