<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – NCF Learning System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📚 NCF LEARNING TRACKING SYSTEM</h1>
            <div class="subtitle">Naga College Foundation</div>
            <span class="badge">Student Portal</span>
        </div>

        <div class="domain-info">
            <span class="icon">🔒</span>
            <span class="text">Restricted to <strong>@ncf.edu.ph</strong> and <strong>@gbox.ncf.edu.ph</strong></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@ncf.edu.ph" required autofocus />
                <span class="hint">Use your official NCF email address</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
                <span class="hint">Enter your account password</span>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="message" style="margin-top:1rem; text-align:center; display:none; padding:0.75rem; border-radius:0.5rem;"></div>

        <div style="text-align:center; margin-top:1rem;">
            Don't have an account? <a href="register.html" style="color:#3b82f6;">Register here</a>
        </div>

        <div class="footer">
            Naga College Foundation &bull; Academic Year 2025-2026
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        // Supabase config (your actual keys)
        const supabaseUrl = 'https://ynpednaybirzfcenmwhd.supabase.co';
        const supabaseAnonKey = 'sb_publishable_hDkrKWcFuZim7MypNeK0VQ_L_FciXAs';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        const ALLOWED_DOMAINS = ['@ncf.edu.ph', '@gbox.ncf.edu.ph'];

        function showMessage(text, isError = true) {
            message.textContent = text;
            message.style.display = 'block';
            message.style.background = isError ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)';
            message.style.color = isError ? '#ef4444' : '#22c55e';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // Domain validation
            const domain = email.substring(email.lastIndexOf('@'));
            if (!ALLOWED_DOMAINS.includes(domain.toLowerCase())) {
                showMessage('Invalid email domain. Use @ncf.edu.ph or @gbox.ncf.edu.ph');
                return;
            }

            if (!email || !password) {
                showMessage('Please enter email and password.');
                return;
            }

            try {
                // 1. Sign in
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // 2. Get profile – using maybeSingle to avoid errors
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                if (profileError) {
                    console.error('Profile fetch error:', profileError);
                    showMessage('Error loading profile. Please contact support.');
                    return;
                }

                // 3. Handle profile cases
                if (!profile) {
                    showMessage('No profile found. Please contact support.');
                    return;
                }

                // 4. Redirect based on role
                if (profile.role === 'instructor') {
                    // Store minimal session info
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('userId', data.user.id);
                    sessionStorage.setItem('userRole', profile.role);
                    sessionStorage.setItem('userName', profile.first_name + ' ' + profile.last_name);
                    window.location.href = 'instructor.html';
                } else if (profile.role === 'student') {
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('userId', data.user.id);
                    sessionStorage.setItem('userRole', profile.role);
                    sessionStorage.setItem('userName', profile.first_name + ' ' + profile.last_name);
                    sessionStorage.setItem('studentEmail', email);
                    sessionStorage.setItem('studentFirstName', profile.first_name);
                    sessionStorage.setItem('studentLastName', profile.last_name);
                    sessionStorage.setItem('studentId', profile.student_id);
                    sessionStorage.setItem('studentSection', profile.section);
                    window.location.href = 'dashboard.html';
                } else if (profile.role === 'pending') {
                    showMessage('⏳ Your account is pending approval. Please wait.', false);
                    await supabase.auth.signOut();
                } else {
                    showMessage('Unknown role. Please contact support.');
                }

            } catch (error) {
                console.error('Login error:', error);
                let msg = error.message || 'Login failed. Please try again.';
                if (msg.includes('Invalid login credentials')) {
                    msg = 'Invalid email or password. Please try again.';
                }
                showMessage('❌ ' + msg);
            }
        });
    </script>
</body>
</html>
