<!-- ASSESSMENTS -->
<section id="section-assessments" class="page-section">
    <div class="page-header">
        <h1>Assessments <small>Build professional exams with question banks and randomisation</small></h1>
    </div>
    <div class="card">
        <div class="card-header"><h3>Create / Edit Assessment</h3></div>
        <form id="assessmentForm">
            <!-- Step 1: Details -->
            <div class="step active" data-step="1">
                <h4>1. Assessment Details</h4>
                <div class="form-grid">
                    <div class="form-group full"><label>Course</label><select id="assessCourse" required></select></div>
                    <div class="form-group"><label>Type</label><select id="assessType"><option>Quiz</option><option>Exam</option><option>Project</option></select></div>
                    <div class="form-group"><label>Duration (min)</label><input type="number" id="assessDuration" value="60" min="1"></div>
                    <div class="form-group full"><label>Title</label><input type="text" id="assessTitle" placeholder="e.g., Midterm Exam" required></div>
                    <div class="form-group full"><label>Description</label><textarea id="assessDesc" rows="2"></textarea></div>
                    <div class="form-group"><label>Max Score</label><input type="number" id="assessMaxScore" value="100" min="1"></div>
                    <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="assessDate" required></div>
                    <div class="form-group"><label>Questions to show</label><input type="number" id="assessShow" placeholder="Leave blank to show all" min="1"></div>
                    <div class="form-group"><label>Randomise questions per student?</label><input type="checkbox" id="assessRandomize"></div>
                    <div class="form-group"><label>AI Grading</label><select id="assessAI"><option value="none">None</option><option value="openai">OpenAI</option><option value="gemini">Gemini</option></select></div>
                </div>
                <button type="button" class="btn btn-primary" onclick="goToStep(2)">Next → Questions</button>
            </div>

            <!-- Step 2: Questions -->
            <div class="step" data-step="2" style="display:none;">
                <h4>2. Question Bank</h4>
                <div id="questionList">
                    <div class="empty-state">No questions added yet.</div>
                </div>
                <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                    <button type="button" class="btn btn-outline" onclick="addQuestion()">+ Add Question</button>
                    <button type="button" class="btn btn-outline" onclick="importFromBank()">📚 Import from Bank</button>
                </div>
                <div style="margin-top:1rem;">
                    <button type="button" class="btn btn-outline" onclick="goToStep(1)">← Back</button>
                    <button type="button" class="btn btn-primary" onclick="goToStep(3)">Next → Settings</button>
                </div>
            </div>

            <!-- Step 3: Settings & Publish -->
            <div class="step" data-step="3" style="display:none;">
                <h4>3. Additional Settings</h4>
                <div class="form-grid">
                    <div class="form-group"><label>Shuffle options per question?</label><input type="checkbox" id="assessShuffleOptions"></div>
                    <div class="form-group"><label>Show correct answers after submission?</label><input type="checkbox" id="assessShowAnswers"></div>
                    <div class="form-group full"><label>Passing Score (%)</label><input type="number" id="assessPassing" value="60" min="0" max="100"></div>
                </div>
                <button type="submit" class="btn btn-success mt-2">🚀 Publish Assessment</button>
                <button type="button" class="btn btn-outline" onclick="goToStep(2)">← Back</button>
            </div>
        </form>
    </div>
</section>
